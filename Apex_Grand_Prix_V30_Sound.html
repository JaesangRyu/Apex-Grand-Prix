<style>

<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* =====================================================================
   APEX GRAND PRIX V30 - isometric F1 racing
   drift / boost / AI personalities / bounce collisions / dev mode
   lamps & lighting / crowds / weather & environments / mobile
   random environment / auto PC-mobile UI / unified UI / conditions card
   corrected car pivot
   + full sound design: countdown, engine layers, AI pass-by (doppler/pan),
     event SFX, ambience, menu music, mastering chain (EQ · glue · limiter)
   ===================================================================== */
const cv=document.getElementById('game'),g=cv.getContext('2d',{alpha:false});
const TAU=Math.PI*2,FONT='"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",system-ui,-apple-system,Roboto,Arial,sans-serif';
const clamp=(v,a,b)=>v<a?a:v>b?b:v,mix=(a,b,t)=>a+(b-a)*t,wrap=(v,n)=>((v%n)+n)%n;
const adiff=(a,b)=>Math.atan2(Math.sin(a-b),Math.cos(a-b)),ease=(k,dt)=>1-Math.exp(-k*dt);
function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const RND=rng(20261027);
let W=0,H=0,DPR=1;
function detectDevice(){const q=new URLSearchParams(location.search).get('ui');if(q==='mobile')return{mobile:true,why:'URL 설정'};if(q==='pc')return{mobile:false,why:'URL 설정'};
  const ua=navigator.userAgent||'',uad=navigator.userAgentData;
  if(uad&&typeof uad.mobile==='boolean'&&uad.mobile)return{mobile:true,why:'모바일 브라우저'};
  if(/Android|iPhone|iPod|Mobile|Windows Phone|BlackBerry|Opera Mini|IEMobile/i.test(ua))return{mobile:true,why:'모바일 기기'};
  if(/iPad|Tablet/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1))return{mobile:true,why:'태블릿'};
  const mm=q=>window.matchMedia&&matchMedia(q).matches;
  if(mm('(any-pointer:fine)')||mm('(any-hover:hover)'))return{mobile:false,why:'마우스·키보드 환경'};
  if(mm('(pointer:coarse)')&&navigator.maxTouchPoints>0)return{mobile:true,why:'터치 전용 기기'};
  return{mobile:false,why:'기본값'}}
const DEVICE=detectDevice();
let touchUI=DEVICE.mobile;

/* ------------------------------------------------------------------ */
/* TRACK ENGINE                                                        */
/* ------------------------------------------------------------------ */
const ROAD=360,HALF=180,KERB=26,STEP=26,RMIN=340,SCALE=1.25,LAPS=3;
const DESIGN=[[-2600,-1400],[-1200,-1400],[200,-1400],[1600,-1400],[2450,-1300],[2800,-900],[2750,-480],[2400,-150],[2650,230],[2380,600],[2600,950],[2980,1250],[2830,1590],[2200,1650],[1000,1640],[0,1620],[-600,1480],[-1150,1680],[-1700,1570],[-2300,1520],[-2780,1220],[-2850,800],[-2500,500],[-1800,450],[-1100,330],[-620,40],[-950,-340],[-1800,-400],[-2600,-520],[-3150,-820],[-3200,-1220],[-2950,-1420]];
const toWorld=(sx,sy)=>({x:(sx+2*sy)/2,y:(2*sy-sx)/2});
function resample(src,step){const n=src.length,cum=[0];for(let i=1;i<=n;i++){const a=src[i-1],b=src[i%n];cum.push(cum[i-1]+Math.hypot(b.x-a.x,b.y-a.y))}
  const L=cum[n],m=Math.round(L/step),out=[];let j=0;for(let k=0;k<m;k++){const d=k*L/m;while(cum[j+1]<d)j++;const a=src[j],b=src[(j+1)%n],t=(d-cum[j])/((cum[j+1]-cum[j])||1);out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t})}return out}
function taubin(p,l){const n=p.length;return p.map((q,i)=>{const a=p[(i-1+n)%n],b=p[(i+1)%n];return{x:q.x+l*((a.x+b.x)/2-q.x),y:q.y+l*((a.y+b.y)/2-q.y)}})}
function buildCenter(){
  const P=DESIGN.map(([sx,sy])=>toWorld(sx*SCALE,sy*SCALE)),n=P.length,dense=[];
  for(let i=0;i<n;i++){const p0=P[(i-1+n)%n],p1=P[i],p2=P[(i+1)%n],p3=P[(i+2)%n];
    for(let k=0;k<40;k++){const t=k/40,t2=t*t,t3=t2*t;
      dense.push({x:.5*(2*p1.x+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3),
                  y:.5*(2*p1.y+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3)})}}
  let pts=resample(dense,STEP);
  for(let it=0;it<60;it++){pts=taubin(pts,.5);pts=taubin(pts,-.53)}
  pts=resample(pts,STEP);
  for(let it=0;it<1500;it++){let moved=false;const m=pts.length,q=pts.map(p=>({x:p.x,y:p.y}));
    for(let i=0;i<m;i++){const a=pts[(i-1+m)%m],b=pts[i],d=pts[(i+1)%m];const h1=Math.atan2(b.y-a.y,b.x-a.x),h2=Math.atan2(d.y-b.y,d.x-b.x),da=Math.abs(adiff(h2,h1)),ds=Math.hypot(d.x-a.x,d.y-a.y)/2;
      if(da>1e-6&&ds/da<RMIN){moved=true;for(let k=-3;k<=3;k++){const j=(i+k+m)%m,w=.25*(1-Math.abs(k)/4),A=pts[(j-1+m)%m],B=pts[(j+1)%m];q[j].x+=w*((A.x+B.x)/2-pts[j].x);q[j].y+=w*((A.y+B.y)/2-pts[j].y)}}}
    pts=q;if(it%25===24)pts=resample(pts,STEP);if(!moved)break}
  pts=resample(pts,STEP);
  const sp=toWorld(-1550*SCALE,-1400*SCALE);let bi=0,bd=1e18;pts.forEach((p,i)=>{const d=(p.x-sp.x)**2+(p.y-sp.y)**2;if(d<bd){bd=d;bi=i}});
  return pts.slice(bi).concat(pts.slice(0,bi));
}
const CPTS=buildCenter(),N=CPTS.length;
const CX=new Float64Array(N),CY=new Float64Array(N),TX=new Float64Array(N),TY=new Float64Array(N),NX=new Float64Array(N),NY=new Float64Array(N);
const K=new Float64Array(N),KS=new Float64Array(N),OFF=new Float64Array(N);let VT=null;
const WO=[new Float64Array(N),new Float64Array(N)],GF=[new Uint8Array(N),new Uint8Array(N)],KF=[new Uint8Array(N),new Uint8Array(N)];
const SA=new Int16Array(N);
const SI=s=>s>0?1:0;
function smoothArr(a,r,pass=1){for(let p=0;p<pass;p++){const c=Float64Array.from(a);for(let i=0;i<N;i++){let s=0;for(let k=-r;k<=r;k++)s+=c[wrap(i+k,N)];a[i]=s/(2*r+1)}}}
function dilate(f,r){const c=Uint8Array.from(f);for(let i=0;i<N;i++){if(!c[i])continue;for(let k=-r;k<=r;k++)f[wrap(i+k,N)]=1}}
function computeVT(grip,decel,vmax){const v=new Float64Array(N);for(let i=0;i<N;i++)v[i]=Math.min(vmax,Math.sqrt(grip/Math.max(Math.abs(KS[i]),1e-6)));
  for(let p=0;p<3;p++)for(let i=N-1;i>=0;i--){const j=(i+1)%N;v[i]=Math.min(v[i],Math.sqrt(v[j]*v[j]+2*decel*STEP))}return v}
(function analyse(){
  for(let i=0;i<N;i++){CX[i]=CPTS[i].x;CY[i]=CPTS[i].y}
  for(let i=0;i<N;i++){const a=(i-1+N)%N,b=(i+1)%N;let dx=CX[b]-CX[a],dy=CY[b]-CY[a],l=Math.hypot(dx,dy);TX[i]=dx/l;TY[i]=dy/l;NX[i]=-TY[i];NY[i]=TX[i]}
  for(let i=0;i<N;i++){const a=(i-1+N)%N,b=(i+1)%N;K[i]=adiff(Math.atan2(TY[b],TX[b]),Math.atan2(TY[a],TX[a]))/(2*STEP)}
  KS.set(K);smoothArr(KS,4,2);
  for(const side of[-1,1]){const w=WO[SI(side)];
    for(let i=0;i<N;i++){const k=KS[i],ak=Math.abs(k),inside=Math.sign(k)===side;let o=360;if(!inside&&ak>1/1500)o=420;if(inside&&ak>1e-6)o=Math.min(o,.8/ak);w[i]=o}
    smoothArr(w,8,2);for(let i=0;i<N;i++){const k=KS[i];if(Math.sign(k)===side&&Math.abs(k)>1e-6)w[i]=Math.min(w[i],.8/Math.abs(k))}
    for(let i=0;i<N;i++){const k=KS[i];GF[SI(side)][i]=(Math.sign(k)!==side&&Math.abs(k)>1/1500)?1:0;KF[SI(side)][i]=Math.abs(k)>1/2100?1:0}
    dilate(GF[SI(side)],4);dilate(KF[SI(side)],3)}
  for(let i=0;i<N;i++)OFF[i]=clamp(KS[i]*700,-1,1)*HALF*.6;smoothArr(OFF,14,2);
  VT=computeVT(430*1.18,360,760);
  for(let i=0;i<N;i++){let k=0;while(k<70&&Math.abs(KS[wrap(i+k,N)])<1/2500)k++;SA[i]=k}
})();
const TRACK_M=Math.round(N*STEP*.13);
const DRS=(function(){const st=[];let s0=0;while(Math.abs(KS[s0])<1/3500)s0++;let run=null;
  for(let k=0;k<=N;k++){const i=(s0+k)%N,str=Math.abs(KS[i])<1/3500&&k<N;if(str&&!run)run={s:i,len:0};if(str)run.len++;if(!str&&run){st.push(run);run=null}}
  st.sort((a,b)=>b.len-a.len);return st.slice(0,2).map(r=>({s:wrap(r.s+6,N),len:r.len-10,mid:wrap(r.s+r.len/2,N),full:r}))})();
const inZone=(u,z)=>wrap(u-z.s,N)<z.len;
const inDRS=u=>DRS.some(z=>inZone(u,z));
function at(arr,u){u=wrap(u,N);const i=Math.floor(u),t=u-i;return mix(arr[i],arr[(i+1)%N],t)}
function sample(u,lat=0){u=wrap(u,N);const i=Math.floor(u),t=u-i,j=(i+1)%N;let nx=mix(NX[i],NX[j],t),ny=mix(NY[i],NY[j],t);const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;
  return{x:mix(CX[i],CX[j],t)+nx*lat,y:mix(CY[i],CY[j],t)+ny*lat,a:Math.atan2(-nx,ny),nx,ny}}
function locate(x,y,hint){let best=1e18,bu=0,blat=0;const full=hint==null,from=full?0:Math.floor(hint)-8,to=full?N:Math.floor(hint)+30;
  for(let k=from;k<to;k++){const i=wrap(k,N),j=(i+1)%N,dx=CX[j]-CX[i],dy=CY[j]-CY[i],l2=dx*dx+dy*dy;const t=clamp(((x-CX[i])*dx+(y-CY[i])*dy)/l2,0,1);
    const qx=CX[i]+dx*t,qy=CY[i]+dy*t,d=(x-qx)**2+(y-qy)**2;if(d<best){best=d;bu=i+t;blat=(x-qx)*mix(NX[i],NX[j],t)+(y-qy)*mix(NY[i],NY[j],t)}}
  return{u:bu,lat:blat,d:Math.sqrt(best)}}
const BB=(function(){let a=1e9,b=-1e9,c=1e9,d=-1e9;for(let i=0;i<N;i++){a=Math.min(a,CX[i]);b=Math.max(b,CX[i]);c=Math.min(c,CY[i]);d=Math.max(d,CY[i])}return{x0:a,x1:b,y0:c,y1:d}})();

/* ------------------------------------------------------------------ */
/* ENVIRONMENT / WEATHER / TIME                                        */
/* ------------------------------------------------------------------ */
const TOD={
  DAY:{k:0,ko:'주간',label:'DAY · 주간'},
  DUSK:{k:.8,top:'#9c7f9f',bot:'#d5a688',sun:'rgba(255,150,80,.30)',ko:'노을',label:'DUSK · 노을'},
  NIGHT:{k:1,top:'#2c3563',bot:'#3d4878',sun:'rgba(80,110,200,.10)',ko:'야간',label:'NIGHT · 야간'}};
const ENVS=['NORMAL','TROPICAL','SNOW','RAIN'];
const ENV={
  NORMAL:{ko:'일반',en:'CLASSIC',grip:1,grade:null,precip:null,col:'#9fe8ff'},
  TROPICAL:{ko:'열대',en:'TROPICAL',grip:1,grade:'#ffe6c4',precip:null,col:'#ffd36b'},
  SNOW:{ko:'눈',en:'SNOW',grip:.74,grade:'#dfe8f6',precip:'snow',col:'#e6f2ff'},
  RAIN:{ko:'비',en:'RAIN',grip:.82,grade:'#8f9bab',precip:'rain',col:'#8fb4ff'}};
const WXL=[{ko:'약',k:.45},{ko:'보통',k:.75},{ko:'강',k:1}];
let tod='DUSK',env='NORMAL',wxi=1,envLock=false,envRolled=false;
function pickW(o){let r=Math.random()*Object.values(o).reduce((a,b)=>a+b,0);for(const k in o){r-=o[k];if(r<=0)return k}return Object.keys(o)[0]}
function randomizeEnv(){env=pickW({NORMAL:35,TROPICAL:22,RAIN:23,SNOW:20});tod=pickW({DAY:40,DUSK:32,NIGHT:28});wxi=+pickW({0:30,1:45,2:25})}
const wxK=()=>WXL[wxi].k;
const envGrip=()=>mix(1,ENV[env].grip,.4+.6*wxK());
const lightK=()=>Math.max(TOD[tod].k,env==='RAIN'?.55*wxK():env==='SNOW'?.3*wxK():0);
function envEffects(){const gr=envGrip(),k=wxK();
  let vis={DAY:100,DUSK:85,NIGHT:68}[tod];if(env==='RAIN')vis-=12+22*k;if(env==='SNOW')vis-=8+16*k;if(env==='TROPICAL'&&tod==='DAY')vis=100;vis=Math.round(clamp(vis,30,100));
  const bars=[['접지력',Math.round(gr*100)],['제동력',Math.round(mix(1,gr,.6)*100)],['코너 속도',Math.round(Math.sqrt(gr)*100)],['시야',vis]];
  const tags=[];
  if(env==='NORMAL')tags.push('드라이 노면','표준 런오프');
  if(env==='TROPICAL')tags.push('드라이 노면','모래 런오프','야자수 코스');
  if(env==='RAIN'){tags.push('빗길 미끄러움','물웅덩이','물보라');if(wxi===2)tags.push('번개 · 천둥')}
  if(env==='SNOW')tags.push('눈길 미끄러움','설원 런오프','눈가루');
  if(lightK()>0)tags.push('가로등 · 헤드라이트 점등');
  if(gr<.97)tags.push('AI도 감속 주행');
  const tip=env==='RAIN'?'브레이크는 일찍, 드리프트는 짧게':env==='SNOW'?'코너 진입 전에 충분히 감속하세요':env==='TROPICAL'?'접지력 최상 — 공격적으로 달리세요':tod==='NIGHT'?'가로등 빛으로 코너를 읽으세요':'드리프트로 부스트를 모으세요';
  return{bars,tags,tip}}

/* ------------------------------------------------------------------ */
/* TEXTURES & STATIC GEOMETRY                                          */
/* ------------------------------------------------------------------ */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}
function shade(hex,amt){let n=parseInt(hex.slice(1),16),r=n>>16,gg=n>>8&255,b=n&255;const t=amt<0?0:255,p=Math.abs(amt);r=Math.round(r+(t-r)*p);gg=Math.round(gg+(t-gg)*p);b=Math.round(b+(t-b)*p);return`rgb(${r},${gg},${b})`}
function noiseTex(size,base,dots,seed){const c=mkCanvas(size,size),x=c.getContext('2d'),r=rng(seed);x.fillStyle=base;x.fillRect(0,0,size,size);
  for(const[col,count,s0,s1]of dots)for(let i=0;i<count;i++){x.fillStyle=col;const s=s0+r()*(s1-s0);x.globalAlpha=.25+r()*.6;x.fillRect(r()*size,r()*size,s,s)}x.globalAlpha=1;return c}
function grassTex(c1,c2,dk,lt,seed,blobA=.10){const S=512,c=mkCanvas(S,S),x=c.getContext('2d'),r=rng(seed);
  x.fillStyle=c1;x.fillRect(0,0,S,S);x.fillStyle=c2;x.fillRect(0,0,S,S/2);
  for(let i=0;i<9000;i++){x.globalAlpha=.18+r()*.35;x.fillStyle=r()<.5?dk:lt;x.fillRect(r()*S,r()*S,1+r()*2.2,1+r()*2.2)}
  for(let i=0;i<260;i++){x.globalAlpha=blobA;x.fillStyle=r()<.5?dk:lt;x.beginPath();x.arc(r()*S,r()*S,6+r()*18,0,TAU);x.fill()}
  x.globalAlpha=1;return c}
const PAT={grass:{},gravel:{},asphalt:{}};
function buildPatterns(){
  const mk=(c,sc)=>{const p=g.createPattern(c,'repeat');p.setTransform(new DOMMatrix().scale(sc));return p};
  PAT.grass.NORMAL=mk(grassTex('#3f8a3a','#4a9842','#2f6e2c','#62b155',7),.62);
  PAT.grass.TROPICAL=mk(grassTex('#3a9f40','#4cb447','#257a33','#9ae05e',8,.14),.62);
  PAT.grass.SNOW=mk(grassTex('#e8eef6','#f2f5fa','#c4d0e0','#ffffff',9,.16),.62);
  PAT.grass.RAIN=mk(grassTex('#2e682f','#357333','#1f4c28','#4b8a45',10),.62);
  PAT.gravel.NORMAL=mk(noiseTex(256,'#cbb38a',[['#9e8662',4200,1.5,3.5],['#e8d7b4',3200,1.2,3],['#7f6a4b',900,1,2.4]],13),.5);
  PAT.gravel.TROPICAL=mk(noiseTex(256,'#ead8a8',[['#d3bd86',4200,1.2,3],['#fbf0d4',3000,1,2.6],['#b89e6a',600,1,2]],14),.5);
  PAT.gravel.SNOW=mk(noiseTex(256,'#dce5ef',[['#b8c5d6',3600,1.4,3.4],['#ffffff',3600,1.2,3],['#9aa9bd',500,1,2]],15),.5);
  PAT.gravel.RAIN=mk(noiseTex(256,'#8d7a5a',[['#6a5940',4200,1.5,3.5],['#a8957a',3000,1.2,3],['#4f4230',900,1,2.4]],16),.5);
  const asp=mk(noiseTex(256,'#3b4046',[['#23272b',5200,1,2.4],['#5a6067',3800,1,2],['#70767d',700,1,1.6]],11),.5);
  PAT.asphalt.NORMAL=PAT.asphalt.TROPICAL=PAT.asphalt.SNOW=asp;
  PAT.asphalt.RAIN=mk(noiseTex(256,'#2b3036',[['#181b1f',5200,1,2.4],['#454b53',3800,1,2],['#5d6670',700,1,1.6]],12),.5);
}
const PATH={};
function loopPath(off,side,p=new Path2D()){for(let i=0;i<=N;i++){const k=i%N,o=typeof off==='number'?off:off[k],x=CX[k]+NX[k]*o*side,y=CY[k]+NY[k]*o*side;i?p.lineTo(x,y):p.moveTo(x,y)}p.closePath();return p}
function bandQuad(p,i,side,o0,o1){const j=(i+1)%N;const a=[CX[i]+NX[i]*o0*side,CY[i]+NY[i]*o0*side],b=[CX[j]+NX[j]*o0*side,CY[j]+NY[j]*o0*side],c=[CX[j]+NX[j]*o1*side,CY[j]+NY[j]*o1*side],d=[CX[i]+NX[i]*o1*side,CY[i]+NY[i]*o1*side];p.moveTo(a[0],a[1]);p.lineTo(b[0],b[1]);p.lineTo(c[0],c[1]);p.lineTo(d[0],d[1]);p.closePath()}
const WALLK=13;
function buildGeometry(){
  PATH.road=new Path2D();loopPath(HALF,1,PATH.road);loopPath(HALF,-1,PATH.road);
  PATH.rim=new Path2D();loopPath(HALF+3,1,PATH.rim);loopPath(HALF+3,-1,PATH.rim);
  PATH.lines=new Path2D();loopPath(HALF-9,1,PATH.lines);loopPath(HALF-9,-1,PATH.lines);
  PATH.rubber=new Path2D();for(let i=0;i<=N;i++){const k=i%N,x=CX[k]+NX[k]*OFF[k],y=CY[k]+NY[k]*OFF[k];i?PATH.rubber.lineTo(x,y):PATH.rubber.moveTo(x,y)}
  PATH.gravel=new Path2D();PATH.kerbR=new Path2D();PATH.kerbW=new Path2D();PATH.kerbShadow=new Path2D();
  for(const side of[-1,1]){const s=SI(side);
    for(let i=0;i<N;i++){if(GF[s][i])bandQuad(PATH.gravel,i,side,HALF+KERB-4,WO[s][i]-8);

const STATIC=[],LAMPS=[];
function nearestCenter(x,y){let b=1e18,bi=0;for(let i=0;i<N;i+=2){const d=(x-CX[i])**2+(y-CY[i])**2;if(d<b){b=d;bi=i}}return{d:Math.sqrt(b),i:bi}}
function buildScenery(){
  const blocks=[];const farSide=i=>(NX[i]+NY[i])>0?-1:1;let si=0;
  DRS.forEach((z,zi)=>{const f=z.full;for(let k=14;k<f.len-14;k+=26){const i=wrap(f.s+k,N);if(Math.abs(TX[i]+TY[i])>.14)continue;const sd=farSide(i),o=WO[SI(sd)][i]+46;
    STATIC.push({kind:'stand',x:CX[i]+NX[i]*o*sd,y:CY[i]+NY[i]*o*sd,spr:SPR.stands[(k/26+zi)%2|0],ph:si++*1.7});blocks.push({x:CX[i]+NX[i]*(o+130)*sd,y:CY[i]+NY[i]*(o+130)*sd,r:400})}});
  const mz=DRS.find(z=>inZone(0,z))||DRS[0];{const i=Math.floor(wrap(mz.full.s+mz.full.len*.5,N)),sd=-farSide(i),o=WO[SI(sd)][i]+70;
    STATIC.push({kind:'pit',x:CX[i]+NX[i]*o*sd,y:CY[i]+NY[i]*o*sd,spr:SPR.pit});for(let k=-14;k<=14;k+=4){const j=wrap(i+k,N);blocks.push({x:CX[j]+NX[j]*(o+90)*sd,y:CY[j]+NY[j]*(o+90)*sd,r:260})}}
  const blocked=(x,y)=>blocks.some(b=>(x-b.x)**2+(y-b.y)**2<b.r*b.r);
  for(let i=0;i<N;i+=11){const sd=(Math.floor(i/11)%2)?1:-1,s=SI(sd),o=WO[s][i]+28,x=CX[i]+NX[i]*o*sd,y=CY[i]+NY[i]*o*sd;if(blocked(x,y))continue;
    const hx=CX[i]+NX[i]*(o-46)*sd,hy=CY[i]+NY[i]*(o-46)*sd,po=Math.max(HALF-70,o-210),px=CX[i]+NX[i]*po*sd,py=CY[i]+NY[i]*po*sd;
    const L={kind:'lamp',x,y,hx,hy,px,py};STATIC.push(L);LAMPS.push(L);blocks.push({x,y,r:60})}
  const okTree=(x,y)=>{const n=nearestCenter(x,y);return n.d>Math.max(WO[0][n.i],WO[1][n.i])+70&&!blocked(x,y)};
  for(let i=0;i<N;i+=2)for(const sd of[-1,1]){if(RND()<.42)continue;const o=WO[SI(sd)][i]+75+Math.pow(RND(),1.7)*850,x=CX[i]+NX[i]*o*sd+(RND()-.5)*60,y=CY[i]+NY[i]*o*sd+(RND()-.5)*60;
    if(okTree(x,y))STATIC.push({kind:'tree',x,y,ti:Math.floor(RND()*6),sc:.8+RND()*.45})}
  for(let k=0;k<1400;k++){const x=mix(BB.x0-1500,BB.x1+1500,RND()),y=mix(BB.y0-1500,BB.y1+1500,RND());const n=nearestCenter(x,y);if(n.d<600||blocked(x,y))continue;
    STATIC.push({kind:'tree',x,y,ti:Math.floor(RND()*6),sc:.85+RND()*.5})}
  let lastApex=-99;for(let i=0;i<N;i++){const a=VT[(i-1+N)%N],b=VT[i],c=VT[(i+1)%N];if(!(b<a&&b<=c))continue;let mx=0;for(let k=1;k<45;k++)mx=Math.max(mx,VT[wrap(i-k,N)]);if(mx-b<140||i-lastApex<30)continue;lastApex=i;
    let bp=i;while(VT[wrap(bp-1,N)]>VT[bp]+.01&&i-bp<60)bp--;const sd=-Math.sign(KS[i])||1;
    [[0,'1'],[4,'2'],[8,'3']].forEach(([d,l])=>{const j=wrap(bp-d,N),o=WO[SI(sd)][j]+20;STATIC.push({kind:'board',x:CX[j]+NX[j]*o*sd,y:CY[j]+NY[j]*o*sd,label:l})})}
  STATIC.forEach(o=>o.depth=o.x+o.y);
}

function resize(){DPR=Math.min(window.devicePixelRatio||1,touchUI?1.5:2);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);buildMini()}

const BLOCK=['F2','Backquote','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','ShiftLeft','ShiftRight','ControlLeft','ControlRight'];
addEventListener('keydown',e=>{if(BLOCK.includes(e.code))e.preventDefault();audioInit();if(!physKeys.has(e.code))pressed.add(e.code);physKeys.add(e.code);syncKeys()});
addEventListener('keyup',e=>{physKeys.delete(e.code);syncKeys()});addEventListener('blur',()=>{physKeys.clear();touchKeys=new Set();ptrs.clear();syncKeys()});
const ptrs=new Map();
function updateTouch(){const set=new Set(),L=layoutTouch();for(const p of ptrs.values())for(const b of L)if(Math.hypot(p.x-b.x,p.y-b.y)<b.r*1.25)set.add(b.key);
  for(const k of set)if(!touchKeys.has(k)&&!physKeys.has(k)){pressed.add(k);if(k==='Space'||k==='ShiftLeft')vibrate(12)}touchKeys=set;syncKeys()}
cv.addEventListener('pointerdown',e=>{audioInit();const x=e.clientX,y=e.clientY;
  for(let i=uiHits.length-1;i>=0;i--){const h=uiHits[i];if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){sfxUI(true);h.act();e.preventDefault();return}}
  if(touchUI&&(mode==='race'||mode==='lights')&&!paused){ptrs.set(e.pointerId,{x,y});try{cv.setPointerCapture(e.pointerId)}catch(_){}updateTouch();e.preventDefault();return}
  if(mode==='menu'||mode==='finish'){pressed.add('Enter');if(touchUI&&document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{})}});
cv.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId)){ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});updateTouch()}});
const endPtr=e=>{if(ptrs.delete(e.pointerId))updateTouch()};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);cv.addEventListener('lostpointercapture',endPtr);
